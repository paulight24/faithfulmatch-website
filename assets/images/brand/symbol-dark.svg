<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FaithfulMatch symbol on dark background">

<defs>
  <linearGradient id="fmGoldRose" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F6D365"/>
    <stop offset="48%" stop-color="#E8A87C"/>
    <stop offset="100%" stop-color="#6D4AFF"/>
  </linearGradient>
  <linearGradient id="fmPurpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#24113F"/>
    <stop offset="100%" stop-color="#332E81"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#101828" flood-opacity="0.25"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="512" height="512" rx="96" fill="url(#fmPurpleBg)"/>

<g transform="translate(0 0) scale(1)" filter="url(#softShadow)">
  <text x="120" y="365" font-family="Georgia, 'Times New Roman', serif" font-size="330" font-weight="700" fill="url(#fmGoldRose)">F</text>
  <path d="M287 230 C316 190 393 205 398 272 C402 333 331 372 274 420 C216 371 147 333 151 272 C156 205 233 190 262 230 C270 242 279 242 287 230Z"
        fill="none" stroke="url(#fmGoldRose)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M302 135 V242 M260 178 H344" stroke="#F6D365" stroke-width="22" stroke-linecap="round"/>
  <circle cx="302" cy="136" r="7" fill="#F6D365" filter="url(#glow)"/>
</g>

</svg>
